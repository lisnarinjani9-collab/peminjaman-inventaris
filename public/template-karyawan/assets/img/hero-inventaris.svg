<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-label="Ilustrasi tumpukan kardus inventaris dan laptop" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- bayangan lantai -->
  <ellipse cx="320" cy="468" rx="270" ry="34" fill="#ffffff" opacity="0.08"/>

  <!-- dekorasi lingkaran -->
  <circle cx="110" cy="120" r="46" fill="#ffffff" opacity="0.06"/>
  <circle cx="560" cy="90" r="30" fill="#f59e0b" opacity="0.25"/>
  <circle cx="70" cy="300" r="10" fill="#f59e0b" opacity="0.5"/>
  <circle cx="590" cy="250" r="8" fill="#ffffff" opacity="0.35"/>

  <!-- kardus besar -->
  <g>
    <polygon points="300,182 420,250 300,318 180,250" fill="#ffcf5c"/>
    <polygon points="180,250 300,318 300,438 180,370" fill="#f59e0b"/>
    <polygon points="300,318 420,250 420,370 300,438" fill="#cf8205"/>
    <!-- lakban -->
    <polygon points="300,182 330,199 210,267 180,250" fill="#ffffff" opacity="0.28"/>
    <!-- label -->
    <g transform="translate(205,315) skewY(29.5)">
      <rect width="62" height="40" rx="5" fill="#ffffff" opacity="0.92"/>
      <rect x="9" y="10" width="44" height="5" rx="2.5" fill="#2b1d14"/>
      <rect x="9" y="21" width="28" height="5" rx="2.5" fill="#2b1d14" opacity="0.5"/>
    </g>
  </g>

  <!-- kardus kecil di atas -->
  <g>
    <polygon points="300,112 380,157 300,202 220,157" fill="#ffe9b0"/>
    <polygon points="220,157 300,202 300,262 220,217" fill="#f7b52e"/>
    <polygon points="300,202 380,157 380,217 300,262" fill="#d68f08"/>
    <polygon points="300,112 320,123 240,168 220,157" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- kardus kiri depan -->
  <g>
    <polygon points="130,330 205,372 130,414 55,372" fill="#f6ead7"/>
    <polygon points="55,372 130,414 130,470 55,428" fill="#e3cba5"/>
    <polygon points="130,414 205,372 205,428 130,470" fill="#c2a273"/>
    <polygon points="130,330 148,340 73,382 55,372" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- laptop -->
  <g>
    <rect x="388" y="318" width="190" height="124" rx="10" fill="#2b1d14" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3"/>
    <rect x="400" y="330" width="166" height="100" rx="5" fill="#4a3322"/>
    <!-- daftar centang -->
    <circle cx="420" cy="353" r="8" fill="#f59e0b"/>
    <path d="M416 353 l3 3.5 l6 -7" fill="none" stroke="#2b1d14" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="436" y="349" width="104" height="8" rx="4" fill="#ffffff" opacity="0.85"/>
    <circle cx="420" cy="380" r="8" fill="#f59e0b"/>
    <path d="M416 380 l3 3.5 l6 -7" fill="none" stroke="#2b1d14" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="436" y="376" width="84" height="8" rx="4" fill="#ffffff" opacity="0.85"/>
    <circle cx="420" cy="407" r="8" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="436" y="403" width="94" height="8" rx="4" fill="#ffffff" opacity="0.4"/>
    <!-- alas laptop -->
    <path d="M368 442 h230 l-14 20 h-202 z" fill="#eadfce"/>
    <rect x="450" y="446" width="66" height="5" rx="2.5" fill="#c2a273"/>
  </g>

  <!-- lencana centang melayang -->
  <g>
    <circle cx="478" cy="196" r="38" fill="#f59e0b"/>
    <circle cx="478" cy="196" r="38" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
    <path d="M461 197 l12 13 l25 -28" fill="none" stroke="#2b1d14" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
